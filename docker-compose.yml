services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stripe_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stripe_payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=stripe_payments;Username=postgres;Password=postgres
      App__PublicBaseUrl: http://localhost:${API_PORT:-8080}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__WebhookSecretFile: /stripe/webhook-secret
      Outbox__WebhookUrl: ${OUTBOX_WEBHOOK_URL:-http://localhost:8080/api/dev/webhook-sink}
      Outbox__SigningSecret: ${OUTBOX_SIGNING_SECRET:-local-demo-signing-secret-change-me}
      Outbox__EnableDevSink: "true"
    volumes:
      - stripe-secret:/stripe:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Forwards test-mode webhooks from your Stripe account to the API and shares the
  # signing secret with it via a volume. Needs STRIPE_SECRET_KEY; exits otherwise.
  stripe-cli:
    image: stripe/stripe-cli:v1.22.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -z "$$STRIPE_SECRET_KEY" ]; then echo "STRIPE_SECRET_KEY is not set in .env - webhook forwarding disabled."; exit 0; fi;
        stripe listen --api-key "$$STRIPE_SECRET_KEY" --print-secret > /stripe/webhook-secret &&
        exec stripe listen --api-key "$$STRIPE_SECRET_KEY" --forward-to http://api:8080/api/webhooks/stripe
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - stripe-secret:/stripe
    depends_on:
      - api

volumes:
  pgdata:
  stripe-secret:
